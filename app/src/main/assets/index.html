<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kalori Hesaplama</title>
<style>
:root{--green:#236b43;--green2:#3c8b5b;--cream:#f5f7f3;--ink:#183025;--muted:#6f7d74;--line:#dfe7df;--orange:#ef8d32;--blue:#3179b8;--red:#c94c4c}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.top{background:linear-gradient(145deg,#173b29,#2f7850);color:white;padding:22px 18px 28px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px #183b2a2b}.title{font-size:24px;font-weight:800}.date{margin-top:6px;opacity:.83;font-size:14px}.wrap{padding:16px;max-width:650px;margin:auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-34px}.sum{background:#fff;border-radius:16px;padding:13px 8px;box-shadow:0 5px 20px #234c3420;text-align:center}.sum b{display:block;font-size:21px}.sum small{color:var(--muted);font-size:11px}.sum.in b{color:var(--green)}.sum.out b{color:var(--orange)}.sum.net b{color:var(--blue)}.card{background:#fff;border-radius:18px;padding:15px;margin-top:14px;box-shadow:0 4px 18px #263a2c12}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.cardhead h2{font-size:17px;margin:0}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}.primary{background:var(--green);color:#fff}.soft{background:#e9f4ec;color:var(--green)}.danger{background:#fdecec;color:var(--red)}.wide{width:100%;font-size:16px;padding:14px}.empty{text-align:center;color:var(--muted);padding:25px 8px}.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.itemname{font-weight:700}.itemsub{font-size:12px;color:var(--muted);margin-top:3px}.kcal{font-weight:800}.iconbtn{border:0;background:#f0f4f0;border-radius:9px;padding:8px;color:var(--muted)}.exercise{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;border:1px solid var(--line);background:#fbfcfb;border-radius:12px;padding:13px;font-size:16px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green2)}.burn{background:#fff3e6;color:#a85c18;border-radius:12px;text-align:center;padding:12px 5px;font-weight:800}.formula{font-size:12px;color:var(--muted);margin-top:9px}.manage{display:flex;gap:9px;margin-top:14px}.manage button{flex:1}.modal{position:fixed;inset:0;background:#13231bb5;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:91vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:up .2s ease}.handle{width:44px;height:5px;background:#d8dfd9;border-radius:9px;margin:-5px auto 15px}.sheet h2{margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{background:#eaf5ed;color:var(--green);border-radius:12px;padding:13px;text-align:center;font-weight:800;margin:12px 0}.actions{display:flex;gap:10px}.actions button{flex:1}.search{margin-bottom:12px}.foodrow{display:grid;grid-template-columns:1fr auto;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}.foodrow strong{display:block}.foodrow small{color:var(--muted)}.foodactions{display:flex;gap:6px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#183025;color:#fff;padding:11px 18px;border-radius:30px;display:none;z-index:50;white-space:nowrap}@keyframes up{from{transform:translateY(30px);opacity:.5}}@media(min-width:700px){.modal{align-items:center;justify-content:center}.sheet{max-width:560px;border-radius:24px;max-height:88vh}}
</style>
</head>
<body>
<header class="top"><div class="title">Kalori Hesaplama</div><div class="date" id="today"></div></header>
<main class="wrap">
 <section class="summary"><div class="sum in"><b id="taken">0</b><small>ALINAN KCAL</small></div><div class="sum out"><b id="burned">0</b><small>YAKILAN KCAL</small></div><div class="sum net"><b id="net">0</b><small>NET KCAL</small></div></section>
 <section class="card"><div class="cardhead"><h2>Bugün yediklerim</h2><button class="btn primary" onclick="openAdd()">+ Besin ekle</button></div><div id="entries"></div></section>
 <section class="card"><div class="cardhead"><h2>Egzersiz</h2></div><div class="exercise"><div class="field"><label>Bugünkü egzersiz süresi</label><input id="minutes" type="number" min="0" inputmode="decimal" placeholder="Dakika" oninput="saveMinutes()"></div><div class="burn"><span id="exerciseKcal">0</span> kcal</div></div><div class="formula">Her 1 dakika egzersiz = 6 kcal</div></section>
 <div class="manage"><button class="btn soft" onclick="openFoods()">Besinlerimi yönet</button><button class="btn danger" onclick="clearDay()">Bugünü temizle</button></div>
</main>

<div class="modal" id="addModal" onclick="backdrop(event,'addModal')"><div class="sheet"><div class="handle"></div><h2>Besin ekle</h2><div class="field search"><label>Besin ara</label><input id="foodSearch" placeholder="Örn. beyaz ekmek" oninput="fillSelect()"></div><div class="field"><label>Besin</label><select id="foodSelect" onchange="foodChanged()"></select></div><div class="row" style="margin-top:11px"><div class="field"><label id="amountLabel">Miktar</label><input id="amount" type="number" min="0" step="0.1" inputmode="decimal" oninput="calcPreview()"></div><div class="field"><label>Birim</label><input id="unitShow" disabled></div></div><div class="result" id="preview">0 kcal</div><div class="actions"><button class="btn soft" onclick="closeModal('addModal')">Vazgeç</button><button class="btn primary" onclick="addEntry()">Güne ekle</button></div></div></div>

<div class="modal" id="foodsModal" onclick="backdrop(event,'foodsModal')"><div class="sheet"><div class="handle"></div><div class="cardhead"><h2>Besinlerim</h2><button class="btn primary" onclick="openFoodEditor()">+ Yeni</button></div><div class="field search"><input id="manageSearch" placeholder="Listede ara" oninput="renderFoods()"></div><div id="foodList"></div><button class="btn soft wide" style="margin-top:14px" onclick="closeModal('foodsModal')">Kapat</button></div></div>

<div class="modal" id="editFoodModal" onclick="backdrop(event,'editFoodModal')"><div class="sheet"><div class="handle"></div><h2 id="editorTitle">Yeni besin</h2><input id="editId" type="hidden"><div class="field"><label>Besinin adı</label><input id="editName"></div><div class="row" style="margin-top:11px"><div class="field"><label>Hesaplama türü</label><select id="editType" onchange="editTypeChanged()"><option value="g">100 gram</option><option value="ml">100 mililitre</option><option value="piece">1 adet/paket</option></select></div><div class="field"><label id="editCalLabel">100 gramdaki kalori</label><input id="editCalories" type="number" min="0" step="0.1" inputmode="decimal"></div></div><div class="actions" style="margin-top:16px"><button class="btn soft" onclick="closeModal('editFoodModal')">Vazgeç</button><button class="btn primary" onclick="saveFood()">Kaydet</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const defaults=[
['Beyaz ekmek','g',265],['Haşlanmış yumurta','g',155],['Tereyağlı yumurta','g',200],['Beyaz peynir','g',310],['Lor peyniri','g',90],['Tereyağlı pirinç pilavı','g',194],['Salçalı makarna','g',150],['Kuru fasulye yemeği','g',130],['Barbunya yemeği','g',124],['Türlü yemeği','g',75],['Zeytinyağlı domates salatası','g',70],['Yoğurt','g',61],['Kaşar peyniri','g',392],['Siyah zeytin','piece',5],['Tahin','g',595],['Bal','g',304],['Kakaolu tahin helvası','g',550],['Sade dondurma','g',207],['Şeftali (orta boy)','piece',59],['Kayısı (orta boy)','piece',17],['Üzüm (1 tane)','piece',3.5],['Yaş incir (orta boy)','piece',37],['Kuru incir (orta boy)','piece',21],['Badem','piece',7],['Fındık','piece',9],['Kaju','piece',9],['Tuzlu ayçekirdeği (iç)','g',584],['Kabak çekirdeği (iç)','g',559],['Şeftali meyve suyu','ml',54],['Kızılay karpuz-çilek maden suyu','ml',32],['Ayran','ml',37],['Sade Türk kahvesi','piece',7],['Az şekerli Türk kahvesi','piece',13],['Orta şekerli Türk kahvesi','piece',19],['Şekerli Türk kahvesi','piece',31],['Tam yağlı süt','ml',61],['Domates-soğanlı tavuk sote','g',169],['Haşlanmış tavuk göğsü','g',165],['Tereyağı','g',717],['Zeytinyağı','g',884],['Sosis','g',300],['Patates kızartması','g',312],['Et kavurma','g',240],['Fırında tavuk (derili)','g',215],['Tavada soslu tavuk ızgara','g',190],['Tavada sossuz tavuk ızgara','g',165],['Mercimek çorbası','ml',55],['Ezogelin çorbası','ml',50],['Tarhana çorbası','ml',60],['Domates çorbası','ml',45],['Tavuk çorbası','ml',50],['Sarı leblebi','g',370],['Kuru üzüm','g',304],['Şekerli sakız','piece',10],['Çubuk kraker','g',380],['Ülker Halley 30 g','piece',132],['Ülker Çizi 70 g paket','piece',319],['Ülker İkram 84 g paket','piece',405],['Ülker Metro 36 g','piece',159],['Cornetto Classico Kaymak','piece',209],['Yarım ekmek tavuk döner','piece',440],['Simit','piece',430],['Menemen','g',90],['Tereyağlı bulgur pilavı','g',130],['Tavuklu patates yemeği','g',155],['Tavada köfte','g',250],['Izgara köfte','g',200],['Mantı (sossuz)','g',190],['Kıymalı pide','g',220],['Karışık pizza','g',266],['Standart hamburger','piece',500],['Cacık','ml',45],['Muz (orta boy)','piece',105],['Elma (orta boy)','piece',95],['Mandalina (orta boy)','piece',47],['Karpuz','g',30],['Çilek','g',32],['Erik','g',46],['Kavun','g',34],['Ülker Çikolatalı Gofret 36 g','piece',195],['Ülker Albeni 40 g','piece',202],['Tuzlu yer fıstığı','g',585],['Nescafé 3ü1 Arada Sütlü Köpüklü','piece',77]
].map((x,i)=>({id:'d'+i,name:x[0],type:x[1],cal:x[2]}));
const keyFoods='kh_foods_v1',todayKey=()=>new Date().toISOString().slice(0,10),keyDay=()=>`kh_day_${todayKey()}`;
let foods=JSON.parse(localStorage.getItem(keyFoods)||'null')||defaults;let day=JSON.parse(localStorage.getItem(keyDay())||'{"entries":[],"minutes":0}');
const fmt=n=>Number(n.toFixed(1)).toLocaleString('tr-TR');const unit=f=>f.type==='g'?'g':f.type==='ml'?'ml':'adet';const basis=f=>f.type==='g'?'100 g':f.type==='ml'?'100 ml':'1 adet';
function calories(f,a){return f.type==='piece'?f.cal*a:f.cal*a/100}function persist(){localStorage.setItem(keyFoods,JSON.stringify(foods));localStorage.setItem(keyDay(),JSON.stringify(day))}
function render(){let total=day.entries.reduce((s,e)=>s+e.kcal,0),burn=(+day.minutes||0)*6;document.getElementById('taken').textContent=fmt(total);document.getElementById('burned').textContent=fmt(burn);document.getElementById('net').textContent=fmt(total-burn);document.getElementById('exerciseKcal').textContent=fmt(burn);document.getElementById('minutes').value=day.minutes||'';let box=document.getElementById('entries');box.innerHTML=day.entries.length?'':`<div class="empty">Henüz besin eklenmedi.<br>İlk öğününü ekleyebilirsin.</div>`;day.entries.forEach((e,i)=>box.insertAdjacentHTML('beforeend',`<div class="item"><div><div class="itemname">${esc(e.name)}</div><div class="itemsub">${fmt(e.amount)} ${e.unit}</div></div><div class="kcal">${fmt(e.kcal)} kcal</div><button class="iconbtn" onclick="deleteEntry(${i})">Sil</button></div>`))}
function openAdd(){document.getElementById('foodSearch').value='';document.getElementById('amount').value='';fillSelect();foodChanged();openModal('addModal')}function fillSelect(){let q=document.getElementById('foodSearch').value.toLocaleLowerCase('tr');let list=foods.filter(f=>f.name.toLocaleLowerCase('tr').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'tr'));document.getElementById('foodSelect').innerHTML=list.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');foodChanged()}
function selectedFood(){return foods.find(f=>f.id===document.getElementById('foodSelect').value)}function foodChanged(){let f=selectedFood();if(!f)return;document.getElementById('amountLabel').textContent=f.type==='piece'?'Adet':'Miktar';document.getElementById('unitShow').value=unit(f);calcPreview()}function calcPreview(){let f=selectedFood(),a=+(document.getElementById('amount').value||0);document.getElementById('preview').textContent=f?fmt(calories(f,a))+' kcal':'0 kcal'}
function addEntry(){let f=selectedFood(),a=+document.getElementById('amount').value;if(!f||a<=0)return toast('Geçerli bir miktar gir');day.entries.push({name:f.name,amount:a,unit:unit(f),kcal:calories(f,a)});persist();render();closeModal('addModal');toast('Besin güne eklendi')}
function deleteEntry(i){day.entries.splice(i,1);persist();render()}function saveMinutes(){day.minutes=Math.max(0,+document.getElementById('minutes').value||0);persist();render()}function clearDay(){if(confirm('Bugünkü besin ve egzersiz kayıtları silinsin mi?')){day={entries:[],minutes:0};persist();render()}}
function openFoods(){document.getElementById('manageSearch').value='';renderFoods();openModal('foodsModal')}function renderFoods(){let q=document.getElementById('manageSearch').value.toLocaleLowerCase('tr'),list=foods.filter(f=>f.name.toLocaleLowerCase('tr').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'tr'));document.getElementById('foodList').innerHTML=list.map(f=>`<div class="foodrow"><div><strong>${esc(f.name)}</strong><small>${fmt(f.cal)} kcal / ${basis(f)}</small></div><div class="foodactions"><button class="iconbtn" onclick="openFoodEditor('${f.id}')">Düzenle</button><button class="iconbtn" onclick="removeFood('${f.id}')">Sil</button></div></div>`).join('')}
function openFoodEditor(id=''){let f=foods.find(x=>x.id===id);document.getElementById('editId').value=id;document.getElementById('editName').value=f?.name||'';document.getElementById('editType').value=f?.type||'g';document.getElementById('editCalories').value=f?.cal||'';document.getElementById('editorTitle').textContent=f?'Besini düzenle':'Yeni besin';editTypeChanged();openModal('editFoodModal')}
function editTypeChanged(){let t=document.getElementById('editType').value;document.getElementById('editCalLabel').textContent=t==='g'?'100 gramdaki kalori':t==='ml'?'100 ml’deki kalori':'1 adet/paket kalorisi'}function saveFood(){let id=document.getElementById('editId').value,name=document.getElementById('editName').value.trim(),type=document.getElementById('editType').value,cal=+document.getElementById('editCalories').value;if(!name||cal<=0)return toast('Ad ve kalori değerini gir');let i=foods.findIndex(f=>f.id===id),obj={id:id||'u'+Date.now(),name,type,cal};if(i>=0)foods[i]=obj;else foods.push(obj);persist();closeModal('editFoodModal');renderFoods();toast('Besin kaydedildi')}
function removeFood(id){let f=foods.find(x=>x.id===id);if(f&&confirm(`“${f.name}” listeden silinsin mi?`)){foods=foods.filter(x=>x.id!==id);persist();renderFoods()}}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function backdrop(e,id){if(e.target.id===id)closeModal(id)}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(t.x);t.x=setTimeout(()=>t.style.display='none',1800)}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('today').textContent=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());render();
</script>

<script>
const EMBEDDED_KALORI_TOKEN = '__KALORI_SYNC_TOKEN__';
</script>

<script src="sync.js"></script>
</body>
</html>

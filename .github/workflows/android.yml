name: Kalori Hesaplama APK Derle
run-name: Kalori Hesaplama - Manuel Derleme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tokeni uygulamaya aktar
        env:
          KALORI_SYNC_TOKEN: ${{ secrets.KALORI_SYNC_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("KALORI_SYNC_TOKEN", "").strip()

          if not token:
              raise SystemExit("KALORI_SYNC_TOKEN secret bulunamadi.")

          path = Path("app/src/main/assets/index.html")
          text = path.read_text(encoding="utf-8")
          placeholder = "__KALORI_SYNC_TOKEN__"

          if placeholder not in text:
              raise SystemExit("Token yeri index.html icinde bulunamadi.")

          path.write_text(
              text.replace(placeholder, token),
              encoding="utf-8",
          )
          PY

      - name: Debug APK derle
        run: gradle assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Kalori-Hesaplama-APK
          path: app/build/outputs/apk/debug/app-debug.apk
